name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Domain and data-integrity tests
        run: npm test
      - name: Supabase migration verification
        run: npm run verify:migration
      - name: Production PWA build
        run: npm run build
      - name: Dependency security gate
        run: npm audit --audit-level=high
